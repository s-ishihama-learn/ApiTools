<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML/HTML & Script Formatter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200">
        <!-- ヘッダー -->
        <h1 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
            </svg>
            XML / HTML & JS フォーマッター
        </h1>

        <!-- ナビゲーションタブ -->
        <div class="border-b border-slate-200 mb-6">
            <nav class="flex gap-4" aria-label="Tabs">
                <button id="tabTextBtn" onclick="switchTab('text')" 
                    class="pb-3 px-1 border-b-2 font-medium text-sm text-indigo-600 border-indigo-600 flex items-center gap-2 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    テキスト直接入力
                </button>
                <button id="tabFileBtn" onclick="switchTab('file')" 
                    class="pb-3 px-1 border-b-2 font-medium text-sm text-slate-500 border-transparent hover:text-slate-700 hover:border-slate-300 flex items-center gap-2 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    ファイルアップロード
                </button>
            </nav>
        </div>

        <!-- ================= タブ1: テキスト直接入力コンテンツ ================= -->
        <div id="textTabContent">
            <!-- エディタ表示エリア -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- 入力エリア -->
                <div class="flex flex-col">
                    <label for="inputText" class="text-sm font-semibold text-slate-600 mb-2">入力 (XML / HTML)</label>
                    <textarea id="inputText" 
                        class="w-full h-96 p-3 font-mono text-xs bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none resize-y"
                        placeholder="ここに整形したいテキストを入力してください..."></textarea>
                </div>

                <!-- 出力エリア -->
                <div class="flex flex-col">
                    <label for="outputText" class="text-sm font-semibold text-slate-600 mb-2">出力結果</label>
                    <textarea id="outputText" readonly 
                        class="w-full h-96 p-3 font-mono text-xs bg-slate-100 border border-slate-300 rounded-lg text-slate-700 resize-y"
                        placeholder="整形結果がここに表示されます..."></textarea>
                </div>
            </div>

            <!-- 操作・エラー表示エリア -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                <button id="formatBtn" onclick="formatText()" 
                    class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-400 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors cursor-pointer">
                    フォーマット実行
                </button>
                <div id="textErrorBox" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 px-4 py-2 rounded-lg w-full sm:w-auto"></div>
            </div>
        </div>

        <!-- ================= タブ2: ファイルアップロードコンテンツ ================= -->
        <div id="fileTabContent" class="hidden max-w-xl mx-auto">
            <p class="text-xs text-slate-500 mb-6">ファイルをアップロードすると、&lt;script&gt;内を含めて整形したファイルを自動でダウンロードします。</p>

            <!-- ファイル選択・ドラッグ＆ドロップ領域 -->
            <div id="dropArea" class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:bg-slate-50 transition-colors cursor-pointer mb-6">
                <input type="file" id="fileInput" class="hidden" accept=".html,.xml,.htm">
                <svg class="mx-auto h-12 w-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-sm font-semibold text-slate-700">クリックしてファイルを選択</p>
                <p class="text-xs text-slate-400 mt-1">またはファイルをここにドラッグ＆ドロップ</p>
                <p id="fileNameDisplay" class="mt-3 text-sm font-semibold text-indigo-600 hidden"></p>
            </div>

            <!-- アクションボタン & エラー表示 -->
            <div class="flex flex-col gap-3">
                <button id="uploadBtn" onclick="uploadAndFormat()" disabled 
                    class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg shadow-sm transition-colors cursor-pointer">
                    整形してダウンロード
                </button>
                <div id="fileErrorBox" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-3 rounded-lg"></div>
            </div>
        </div>

    </div>

    <script>
    // ---------------- タブ切り替え制御 ----------------
    function switchTab(tab) {
        const textTabContent = document.getElementById("textTabContent");
        const fileTabContent = document.getElementById("fileTabContent");
        const tabTextBtn = document.getElementById("tabTextBtn");
        const tabFileBtn = document.getElementById("tabFileBtn");

        if (tab === 'text') {
            textTabContent.classList.remove("hidden");
            fileTabContent.classList.add("hidden");

            tabTextBtn.className = "pb-3 px-1 border-b-2 font-medium text-sm text-indigo-600 border-indigo-600 flex items-center gap-2 transition-colors";
            tabFileBtn.className = "pb-3 px-1 border-b-2 font-medium text-sm text-slate-500 border-transparent hover:text-slate-700 hover:border-slate-300 flex items-center gap-2 transition-colors";
        } else {
            textTabContent.classList.add("hidden");
            fileTabContent.classList.remove("hidden");

            tabFileBtn.className = "pb-3 px-1 border-b-2 font-medium text-sm text-indigo-600 border-indigo-600 flex items-center gap-2 transition-colors";
            tabTextBtn.className = "pb-3 px-1 border-b-2 font-medium text-sm text-slate-500 border-transparent hover:text-slate-700 hover:border-slate-300 flex items-center gap-2 transition-colors";
        }
    }

    // ---------------- 1. テキスト整形処理 ----------------
    async function formatText() {
        const input = document.getElementById("inputText").value;
        const outputArea = document.getElementById("outputText");
        const errorBox = document.getElementById("textErrorBox");
        const formatBtn = document.getElementById("formatBtn");

        errorBox.classList.add("hidden");
        errorBox.textContent = "";

        if (!input.trim()) {
            errorBox.textContent = "入力テキストが空です。";
            errorBox.classList.remove("hidden");
            return;
        }

        formatBtn.disabled = true;
        formatBtn.textContent = "処理中...";

        try {
            const response = await fetch('/format/json', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: input })
            });

            if (!response.ok) {
                throw new Error(`エラーが発生しました (ステータス: ${response.status})`);
            }

            // const resultText = await response.text();
            // outputArea.value = resultText;
            const data = await response.json();
            outputArea.value = data.formatted_content;

        } catch (err) {
            errorBox.textContent = err.message || "通信エラーが発生しました。サーバーが起動しているか確認してください。";
            errorBox.classList.remove("hidden");
        } finally {
            formatBtn.disabled = false;
            formatBtn.textContent = "フォーマット実行";
        }
    }

    // ---------------- 2. ファイルアップロード処理 ----------------
    const fileInput = document.getElementById("fileInput");
    const dropArea = document.getElementById("dropArea");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileErrorBox = document.getElementById("fileErrorBox");

    let selectedFile = null;

    dropArea.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
    });

    ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => e.preventDefault(), false);
    });

    ["dragenter", "dragover"].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.add("bg-indigo-50", "border-indigo-400"), false);
    });

    ["dragleave", "drop"].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.remove("bg-indigo-50", "border-indigo-400"), false);
    });

    dropArea.addEventListener("drop", (e) => {
        const files = e.dataTransfer.files;
        if (files.length > 0) handleFileSelect(files[0]);
    });

    function handleFileSelect(file) {
        selectedFile = file;
        fileNameDisplay.textContent = `選択中: ${file.name}`;
        fileNameDisplay.classList.remove("hidden");
        uploadBtn.disabled = false;
        fileErrorBox.classList.add("hidden");
    }

    async function uploadAndFormat() {
        if (!selectedFile) return;

        uploadBtn.disabled = true;
        uploadBtn.textContent = "処理中...";
        fileErrorBox.classList.add("hidden");

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
            const response = await fetch(`../format/file`, {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || `エラーが発生しました (ステータス: ${response.status})`);
            }

            const disposition = response.headers.get("Content-Disposition");
            let downloadName = "formatted_file.html";
            if (disposition && disposition.includes("filename=")) {
                const match = disposition.match(/filename=["']?([^"']+)["']?/);
                if (match && match[1]) downloadName = match[1];
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = downloadName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

        } catch (err) {
            fileErrorBox.textContent = err.message || "通信エラーが発生しました。サーバーが起動しているか確認してください。";
            fileErrorBox.classList.remove("hidden");
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = "整形してダウンロード";
        }
    }
    </script>

</body>
</html>
